name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('Dockerfile.rm2-build', 'rm2-toolchain.cmake', 'patches/**') }}
          restore-keys: ccache-${{ runner.os }}-
      - run: ./build.sh
        env:
          NVIM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.12.4' }}
      - uses: actions/upload-artifact@v7
        with:
          name: neovim-rm2-armv7
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: armv7
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: neovim-rm2-armv7
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "Neovim $GITHUB_REF_NAME for reMarkable 2" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
