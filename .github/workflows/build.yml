name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('Dockerfile.rm2-build', 'rm2-toolchain.cmake', 'patches/**') }}
          restore-keys: ccache-${{ runner.os }}-
      - run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: neovim-rm2-armv7
          path: dist/neovim-rm2-v0.12.4-armv7.tar.gz
          if-no-files-found: error
